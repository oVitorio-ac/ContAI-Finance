{% extends 'base.html' %}

{% block title %}File Upload - ContAI Finance{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h2>Upload CSV File</h2>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="mb-3">
                <label for="{{ form.titulo.id_for_label }}" class="form-label">File Title</label>
                {{ form.titulo }}
            </div>
            <div class="mb-3">
                <label for="{{ form.arquivo.id_for_label }}" class="form-label">Select CSV File</label>
                {{ form.arquivo }}
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>
</div>
{% endblock %}
